# =============================================================================
# Divoom Pixoo 64 - temporary feedback / interaction bursts
# https://github.com/dadiggi/divoom-pixoo-ha
#
# This package is intentionally separate from pixoo_animated.yaml.
# The animated dashboard keeps using pre-rendered GIF pages; this package uses
# divoom_pixoo.show_message for fast, temporary 64x64 interaction screens.
#
# The show_message service interrupts the normal page rotation. This package
# explicitly redraws the previously active normal page after each feedback burst,
# then lets the integration continue its configured page rotation.
# =============================================================================

# ============================================================
# USER CONFIGURATION
# ============================================================
# Edit the Pixoo Current Page entity here if Home Assistant names it differently.

template:
  - sensor:
      - name: Pixoo Feedback Configuration
        unique_id: pixoo_feedback_configuration
        icon: mdi:message-badge-outline
        state: configured
        attributes:
          pixoo_entity: &cfg_pixoo_feedback_entity "sensor.divoom_pixoo_64_current_page"

# ============================================================
# RUNTIME HELPERS / TUNABLE PARAMETERS
# ============================================================

input_boolean:
  pixoo_feedback_initialized:
    name: Pixoo feedback - Defaults applied
    icon: mdi:check-decagram
  pixoo_feedback_enabled:
    name: Pixoo feedback - Enabled
    icon: mdi:message-flash
  pixoo_feedback_restore_initialized:
    name: Pixoo feedback - Restore defaults applied
    icon: mdi:backup-restore

input_number:
  pixoo_feedback_target_duration_seconds:
    name: Pixoo feedback - Target duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_toggle_duration_seconds:
    name: Pixoo feedback - On/off duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_brightness_duration_seconds:
    name: Pixoo feedback - Brightness duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_scene_duration_seconds:
    name: Pixoo feedback - Scene duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_resume_rotation_seconds:
    name: Pixoo feedback - Resume rotation after restore
    icon: mdi:rotate-right
    min: 1
    max: 30
    step: 1
    mode: box
    unit_of_measurement: s

# ============================================================
# GENERIC FEEDBACK API
# ============================================================
#
# Call script.pixoo_feedback with:
#   kind: target | toggle | brightness | scene
#   target: living | dining | both
#
# Optional values:
#   state: on | off
#   dining_brightness / living_brightness: 0..100
#   dining_scene / living_scene: short display names
#
# The script is generic on purpose; lighting is only its first consumer.

script:
  pixoo_feedback:
    alias: Pixoo - Show temporary feedback
    icon: mdi:message-flash-outline
    mode: restart
    fields:
      kind:
        name: Feedback kind
        required: true
        selector:
          select:
            options:
              - target
              - toggle
              - brightness
              - scene
      target:
        name: Target
        required: true
        selector:
          select:
            options:
              - living
              - dining
              - both
      state:
        name: On/off state
        required: false
        selector:
          select:
            options:
              - "on"
              - "off"
      dining_brightness:
        name: Dining brightness
        required: false
        selector:
          number:
            min: 0
            max: 100
      living_brightness:
        name: Living brightness
        required: false
        selector:
          number:
            min: 0
            max: 100
      dining_scene:
        name: Dining scene
        required: false
      living_scene:
        name: Living scene
        required: false
    variables:
      pixoo_entity: *cfg_pixoo_feedback_entity
      kind_value: "{{ kind | default('target') | lower }}"
      target_value: "{{ target | default('living') | lower }}"
      language: "{{ states('input_select.pixoo_language') }}"
      is_hr: "{{ language == 'hrvatski' }}"

      target_label: >-
        {% if is_hr | bool %}
          {% if target_value == 'dining' %}BLAGOVAONICA
          {% elif target_value == 'both' %}OBA
          {% else %}DNEVNI{% endif %}
        {% else %}
          {% if target_value == 'dining' %}DINING
          {% elif target_value == 'both' %}BOTH
          {% else %}LIVING{% endif %}
        {% endif %}
      target_short: >-
        {% if is_hr | bool %}
          {% if target_value == 'dining' %}BLAG.
          {% elif target_value == 'both' %}OBA
          {% else %}DNEVNI{% endif %}
        {% else %}
          {% if target_value == 'dining' %}DINING
          {% elif target_value == 'both' %}BOTH
          {% else %}LIVING{% endif %}
        {% endif %}
      control_label: "{{ 'UPRAVLJANJE' if is_hr | bool else 'CONTROL' }}"
      selected_label: "{{ 'ODABRANO' if is_hr | bool else 'SELECTED' }}"
      state_label: >-
        {% if is_hr | bool %}
          {{ 'UKLJUČENO' if state | default('off') == 'on' else 'ISKLJUČENO' }}
        {% else %}
          {{ 'ON' if state | default('off') == 'on' else 'OFF' }}
        {% endif %}
      mode_label: >-
        {% if is_hr | bool %}
          {{ 'RUČNO' if state | default('off') == 'on' else 'AUTO SPREMNO' }}
        {% else %}
          {{ 'MANUAL' if state | default('off') == 'on' else 'AUTO READY' }}
        {% endif %}
      brightness_label: "{{ 'SVJETLINA' if is_hr | bool else 'BRIGHTNESS' }}"
      synchronized_label: "{{ 'SINKRONIZIRANO' if is_hr | bool else 'SYNCHRONIZED' }}"
      scene_label: "{{ 'SCENA' if is_hr | bool else 'SCENE' }}"

      dining_pct: >-
        {% set v = dining_brightness | default(0) | int(0) %}
        {{ [0, [100, v] | min] | max }}
      living_pct: >-
        {% set v = living_brightness | default(0) | int(0) %}
        {{ [0, [100, v] | min] | max }}
      single_pct: "{{ living_pct if target_value == 'living' else dining_pct }}"
      both_pct: "{{ (((dining_pct | int(0)) + (living_pct | int(0))) / 2) | round(0) | int }}"

      dining_scene_label: >-
        {% set raw = dining_scene | default('') %}
        {% set key = raw | lower %}
        {% if is_hr | bool %}
          {% if key == 'bright' %}JARKO
          {% elif key == 'relax' %}OPUŠTENO
          {% elif key == 'dimmed' %}PRIGUŠENO
          {% elif key == 'savanna sunset' %}SAVANA ZALAZAK
          {% else %}{{ raw | upper }}{% endif %}
        {% else %}
          {{ raw | upper }}
        {% endif %}
      living_scene_label: >-
        {% set raw = living_scene | default('') %}
        {% set key = raw | lower %}
        {% if is_hr | bool %}
          {% if key == 'bright' %}JARKO
          {% elif key == 'relax' %}OPUŠTENO
          {% elif key == 'dimmed' %}PRIGUŠENO
          {% elif key == 'savanna sunset' %}SAVANA ZALAZAK
          {% else %}{{ raw | upper }}{% endif %}
        {% else %}
          {{ raw | upper }}
        {% endif %}
      same_scene: "{{ (dining_scene | default('') | lower) == (living_scene | default('') | lower) }}"
      scene_line_1: >-
        {% if target_value == 'dining' %}
          {{ dining_scene_label }}
        {% elif target_value == 'living' %}
          {{ living_scene_label }}
        {% elif same_scene | bool %}
          {{ dining_scene_label }}
        {% elif is_hr | bool %}
          B: {{ dining_scene_label }}
        {% else %}
          D: {{ dining_scene_label }}
        {% endif %}
      scene_line_2: >-
        {% if target_value == 'both' and not (same_scene | bool) %}
          {% if is_hr | bool %}D: {{ living_scene_label }}{% else %}L: {{ living_scene_label }}{% endif %}
        {% else %}
        {% endif %}

      duration_seconds: >-
        {% if kind_value == 'brightness' %}
          {{ states('input_number.pixoo_feedback_brightness_duration_seconds') | int(2) }}
        {% elif kind_value == 'scene' %}
          {{ states('input_number.pixoo_feedback_scene_duration_seconds') | int(3) }}
        {% elif kind_value == 'toggle' %}
          {{ states('input_number.pixoo_feedback_toggle_duration_seconds') | int(2) }}
        {% else %}
          {{ states('input_number.pixoo_feedback_target_duration_seconds') | int(3) }}
        {% endif %}
      resume_rotation_seconds: "{{ states('input_number.pixoo_feedback_resume_rotation_seconds') | int(5) }}"
      service_hold_seconds: "{{ (duration_seconds | int(2)) + (resume_rotation_seconds | int(5)) }}"

      single_bar_width: "{{ [1, ((single_pct | int(0)) * 46 / 100) | round(0) | int] | max }}"
      both_bar_width: "{{ [1, ((both_pct | int(0)) * 46 / 100) | round(0) | int] | max }}"
      single_highlight_width: "{{ [1, (single_bar_width | int(1)) - 2] | max }}"
      both_highlight_width: "{{ [1, (both_bar_width | int(1)) - 2] | max }}"

    sequence:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_enabled
        state: "on"

      - choose:
          # Target selection
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'target' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  # Keep the integration's own next-page timer beyond the
                  # explicit restore below. This prevents a race between its
                  # scheduler and our restore of the previously displayed page.
                  duration: "{{ service_hold_seconds | int(8) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [18, 38, 58], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [9, 20, 33], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [84, 188, 255], filled: true}
                      - {type: rectangle, position: [3, 6], size: [2, 48], color: [41, 105, 165], filled: true}
                      - type: text
                        position: [31, 9]
                        content: "{{ control_label }}"
                        font: Tiny5
                        color: [122, 205, 255]
                        align: center
                      - type: text
                        position: [31, 26]
                        content: "{{ target_label }}"
                        font: PixelifySans
                        color: [245, 250, 255]
                        align: center
                      - type: text
                        position: [31, 49]
                        content: "{{ selected_label }}"
                        font: Tiny5
                        color: [255, 196, 92]
                        align: center

          # On/off result
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'toggle' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(7) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [25, 45, 55], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [10, 22, 30], filled: true}
                      - type: rectangle
                        position: [3, 4]
                        size: [55, 2]
                        color: "{{ [83, 235, 157] if state | default('off') == 'on' else [104, 124, 145] }}"
                        filled: true
                      - type: text
                        position: [31, 9]
                        content: "{{ target_label }}"
                        font: Tiny5
                        color: [202, 229, 247]
                        align: center
                      - type: text
                        position: [31, 25]
                        content: "{{ state_label }}"
                        font: PixelifySans
                        color: "{{ [116, 255, 180] if state | default('off') == 'on' else [168, 181, 193] }}"
                        align: center
                      - type: text
                        position: [31, 48]
                        content: "{{ mode_label }}"
                        font: Tiny5
                        color: [255, 198, 97]
                        align: center

          # Brightness - one room
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'brightness' and target_value != 'both' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(7) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [40, 36, 22], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [18, 20, 24], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [255, 205, 76], filled: true}
                      - type: text
                        position: [31, 8]
                        content: "{{ target_short }}"
                        font: Tiny5
                        color: [211, 225, 237]
                        align: center
                      - type: text
                        position: [31, 19]
                        content: "{{ single_pct }}"
                        font: ELEVEN_PIX
                        color: [255, 248, 220]
                        align: center
                      - type: text
                        position: [49, 25]
                        content: "%"
                        font: Tiny5
                        color: [255, 205, 76]
                        align: center
                      - {type: rectangle, position: [8, 41], size: [50, 9], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [6, 39], size: [50, 9], color: [104, 83, 35], filled: true}
                      - {type: rectangle, position: [8, 41], size: [46, 5], color: [34, 31, 24], filled: true}
                      - type: rectangle
                        position: [8, 41]
                        size: ["{{ single_bar_width }}", 5]
                        color: [245, 177, 47]
                        filled: true
                      - type: rectangle
                        position: [9, 41]
                        size: ["{{ single_highlight_width }}", 1]
                        color: [255, 237, 166]
                        filled: true
                      - type: text
                        position: [31, 53]
                        content: "{{ brightness_label }}"
                        font: Tiny5
                        color: [255, 205, 76]
                        align: center

          # Brightness - both synchronized rooms
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'brightness' and target_value == 'both' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(7) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [40, 36, 22], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [18, 20, 24], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [255, 205, 76], filled: true}
                      - type: text
                        position: [31, 8]
                        content: "{{ target_label }}"
                        font: Tiny5
                        color: [211, 225, 237]
                        align: center
                      - type: text
                        position: [31, 19]
                        content: "{{ both_pct }}"
                        font: ELEVEN_PIX
                        color: [255, 248, 220]
                        align: center
                      - type: text
                        position: [49, 25]
                        content: "%"
                        font: Tiny5
                        color: [255, 205, 76]
                        align: center
                      - {type: rectangle, position: [8, 41], size: [50, 9], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [6, 39], size: [50, 9], color: [104, 83, 35], filled: true}
                      - {type: rectangle, position: [8, 41], size: [46, 5], color: [34, 31, 24], filled: true}
                      - type: rectangle
                        position: [8, 41]
                        size: ["{{ both_bar_width }}", 5]
                        color: [245, 177, 47]
                        filled: true
                      - type: rectangle
                        position: [9, 41]
                        size: ["{{ both_highlight_width }}", 1]
                        color: [255, 237, 166]
                        filled: true
                      - type: text
                        position: [31, 53]
                        content: "{{ synchronized_label }}"
                        font: Tiny5
                        color: [120, 231, 181]
                        align: center

          # Scene
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'scene' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(8) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [38, 25, 52], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [18, 13, 27], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [201, 128, 255], filled: true}
                      - type: text
                        position: [31, 8]
                        content: "{{ target_short }}"
                        font: Tiny5
                        color: [218, 208, 232]
                        align: center
                      - type: text
                        position: [31, 16]
                        content: "{{ scene_label }}"
                        font: Tiny5
                        color: [201, 128, 255]
                        align: center
                      - type: text
                        position: [31, 30]
                        content: "{{ scene_line_1 }}"
                        font: Tiny5
                        color: [249, 245, 255]
                        align: center
                      - type: text
                        position: [31, 42]
                        content: "{{ scene_line_2 }}"
                        font: Tiny5
                        color: [181, 158, 204]
                        align: center

      # Explicitly restore the normal page that was current before the burst.
      # Because this script is mode: restart, every new rotary event cancels
      # this delay and starts it again; the page therefore stays in feedback
      # mode only while the user is actively interacting.
      - delay:
          seconds: "{{ duration_seconds | int(2) }}"
      - action: divoom_pixoo.update_page
        continue_on_error: true
        target:
          entity_id: "{{ pixoo_entity }}"

# ============================================================
# EVENT BRIDGE
# ============================================================
#
# Other packages can request a temporary Pixoo page by firing:
#   event: pixoo_feedback_request
# with semantic fields such as kind, target, brightness, scene, etc.
#
# The sender does not need to know the Pixoo entity, service, or enable helper.

automation:
  - id: pixoo_feedback_event_bridge
    alias: Pixoo feedback - Handle feedback request
    mode: restart
    triggers:
      - trigger: event
        event_type: pixoo_feedback_request
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_enabled
        state: "on"
    actions:
      - action: script.pixoo_feedback
        data:
          kind: "{{ trigger.event.data.kind | default('target', true) }}"
          target: "{{ trigger.event.data.target | default('living', true) }}"
          state: "{{ trigger.event.data.state | default('off', true) }}"
          dining_brightness: "{{ trigger.event.data.dining_brightness | default(0, true) }}"
          living_brightness: "{{ trigger.event.data.living_brightness | default(0, true) }}"
          dining_scene: "{{ trigger.event.data.dining_scene | default('', true) }}"
          living_scene: "{{ trigger.event.data.living_scene | default('', true) }}"

# ============================================================
# FIRST-RUN DEFAULTS
# ============================================================

  - id: pixoo_feedback_restore_initialize_defaults
    alias: Pixoo feedback - Restore initialize defaults
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_restore_initialized
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.pixoo_feedback_resume_rotation_seconds
        data:
          value: 5
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pixoo_feedback_restore_initialized

  - id: pixoo_feedback_first_run_defaults
    alias: Pixoo feedback - First run defaults
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_initialized
        state: "off"
    actions:
      - repeat:
          for_each:
            - {entity: input_number.pixoo_feedback_target_duration_seconds, value: 3}
            - {entity: input_number.pixoo_feedback_toggle_duration_seconds, value: 2}
            - {entity: input_number.pixoo_feedback_brightness_duration_seconds, value: 2}
            - {entity: input_number.pixoo_feedback_scene_duration_seconds, value: 3}
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                value: "{{ repeat.item.value }}"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.pixoo_feedback_enabled
            - input_boolean.pixoo_feedback_initialized
