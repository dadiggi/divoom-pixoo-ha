# =============================================================================
# Divoom Pixoo 64 - temporary feedback / interaction bursts
# https://github.com/dadiggi/divoom-pixoo-ha
#
# This package is intentionally separate from pixoo_animated.yaml.
# The animated dashboard keeps using pre-rendered GIF pages; this package uses
# divoom_pixoo.show_message for fast, temporary 64x64 interaction screens.
#
# The show_message service interrupts the normal page rotation. An independent
# timer/automation redraws the previously active configured page after the burst,
# then the integration continues its normal page rotation.
# =============================================================================

# ============================================================
# USER CONFIGURATION
# ============================================================
# Edit the Pixoo Current Page entity here if Home Assistant names it differently.

template:
  - sensor:
      - name: Pixoo Feedback Configuration
        unique_id: pixoo_feedback_configuration
        icon: mdi:message-badge-outline
        state: configured
        attributes:
          pixoo_entity: &cfg_pixoo_feedback_entity "sensor.divoom_pixoo_64_current_page"

# ============================================================
# RUNTIME HELPERS / TUNABLE PARAMETERS
# ============================================================

input_boolean:
  pixoo_feedback_initialized:
    name: Pixoo feedback - Defaults applied
    icon: mdi:check-decagram
  pixoo_feedback_enabled:
    name: Pixoo feedback - Enabled
    icon: mdi:message-flash
  pixoo_feedback_restore_initialized:
    name: Pixoo feedback - Restore defaults applied
    icon: mdi:backup-restore

input_number:
  pixoo_feedback_target_duration_seconds:
    name: Pixoo feedback - Target duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_toggle_duration_seconds:
    name: Pixoo feedback - On/off duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_brightness_duration_seconds:
    name: Pixoo feedback - Brightness duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_scene_duration_seconds:
    name: Pixoo feedback - Scene duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_resume_rotation_seconds:
    name: Pixoo feedback - Resume rotation after restore
    icon: mdi:rotate-right
    min: 1
    max: 30
    step: 1
    mode: box
    unit_of_measurement: s

# ============================================================
# RESTORE TIMER
# ============================================================
#
# Every feedback request restarts this timer. A separate automation restores
# the currently configured normal Pixoo page when the timer finishes. Keeping
# restoration outside the restartable feedback script prevents rapid rotary
# events from cancelling the restore step.

timer:
  pixoo_feedback_restore:
    name: Pixoo feedback - Restore normal page
    restore: false

# ============================================================
# GENERIC FEEDBACK API
# ============================================================
#
# Call script.pixoo_feedback with:
#   kind: target | toggle | brightness | scene
#   target: living | dining | both
#
# Optional values:
#   state: on | off
#   dining_brightness / living_brightness: 0..100
#   dining_scene / living_scene: short display names
#
# The script is generic on purpose; lighting is only its first consumer.

script:
  pixoo_feedback:
    alias: Pixoo - Show temporary feedback
    icon: mdi:message-flash-outline
    mode: restart
    fields:
      kind:
        name: Feedback kind
        required: true
        selector:
          select:
            options:
              - target
              - toggle
              - brightness
              - scene
      target:
        name: Target
        required: true
        selector:
          select:
            options:
              - living
              - dining
              - both
              - ambilight
      state:
        name: On/off state
        required: false
        selector:
          select:
            options:
              - "on"
              - "off"
      dining_brightness:
        name: Dining brightness
        required: false
        selector:
          number:
            min: 0
            max: 100
      living_brightness:
        name: Living brightness
        required: false
        selector:
          number:
            min: 0
            max: 100
      dining_scene:
        name: Dining scene
        required: false
      living_scene:
        name: Living scene
        required: false
    variables:
      pixoo_entity: *cfg_pixoo_feedback_entity
      kind_value: "{{ kind | default('target') | lower }}"
      target_value: "{{ target | default('living') | lower }}"
      language: "{{ states('input_select.pixoo_language') }}"
      is_hr: "{{ language == 'hrvatski' }}"

      # Natural, short labels sized for the 64px canvas.
      target_label: >-
        {% if target_value == 'ambilight' %}
          Ambilight
        {% elif is_hr | bool %}
          {% if target_value == 'dining' %}Blagovaonica
          {% elif target_value == 'both' %}Obje
          {% else %}Dnevna{% endif %}
        {% else %}
          {% if target_value == 'dining' %}Dining
          {% elif target_value == 'both' %}Both
          {% else %}Living{% endif %}
        {% endif %}
      target_context: >-
        {% if target_value == 'ambilight' %}
          Ambilight + Hue
        {% elif is_hr | bool %}
          {% if target_value == 'both' %}Obje sobe{% else %}{{ target_label }}{% endif %}
        {% else %}
          {% if target_value == 'both' %}Both rooms{% else %}{{ target_label }}{% endif %}
        {% endif %}
      selected_room_label: >-
        {% if target_value == 'ambilight' %}
          {{ 'Odabrano' if is_hr | bool else 'Selected' }}
        {% else %}
          {{ 'Odabrana soba' if is_hr | bool else 'Selected room' }}
        {% endif %}
      state_label: >-
        {% if is_hr | bool %}
          {{ 'Uključeno' if state | default('off') == 'on' else 'Isključeno' }}
        {% else %}
          {{ 'On' if state | default('off') == 'on' else 'Off' }}
        {% endif %}
      mode_label: >-
        {% if target_value == 'ambilight' %}
          Philips TV
        {% elif is_hr | bool %}
          {{ 'Ručno' if state | default('off') == 'on' else 'Automatski' }}
        {% else %}
          {{ 'Manual' if state | default('off') == 'on' else 'Automatic' }}
        {% endif %}
      brightness_label: "{{ 'Svjetlina' if is_hr | bool else 'Brightness' }}"
      scene_label: "{{ 'Scena' if is_hr | bool else 'Scene' }}"

      dining_pct: >-
        {% set v = dining_brightness | default(0) | int(0) %}
        {{ [0, [100, v] | min] | max }}
      living_pct: >-
        {% set v = living_brightness | default(0) | int(0) %}
        {{ [0, [100, v] | min] | max }}
      single_pct: "{{ living_pct if target_value == 'living' else dining_pct }}"
      both_pct: "{{ (((dining_pct | int(0)) + (living_pct | int(0))) / 2) | round(0) | int }}"

      dining_scene_label: >-
        {% set raw = dining_scene | default('') %}
        {% set key = raw | lower %}
        {% if is_hr | bool %}
          {% if key == 'bright' %}Jarko
          {% elif key == 'relax' %}Opušteno
          {% elif key == 'dimmed' %}Prigušeno
          {% elif key == 'savanna sunset' %}Zalazak savane
          {% else %}{{ raw }}{% endif %}
        {% else %}
          {{ raw }}
        {% endif %}
      living_scene_label: >-
        {% set raw = living_scene | default('') %}
        {% set key = raw | lower %}
        {% if is_hr | bool %}
          {% if key == 'bright' %}Jarko
          {% elif key == 'relax' %}Opušteno
          {% elif key == 'dimmed' %}Prigušeno
          {% elif key == 'savanna sunset' %}Zalazak savane
          {% else %}{{ raw }}{% endif %}
        {% else %}
          {{ raw }}
        {% endif %}
      same_scene: "{{ (dining_scene | default('') | lower) == (living_scene | default('') | lower) }}"
      scene_line_1: >-
        {% if target_value == 'dining' %}
          {{ dining_scene_label }}
        {% elif target_value == 'living' %}
          {{ living_scene_label }}
        {% elif same_scene | bool %}
          {{ dining_scene_label }}
        {% elif is_hr | bool %}
          Blag.: {{ dining_scene_label }}
        {% else %}
          Dining: {{ dining_scene_label }}
        {% endif %}
      scene_line_2: >-
        {% if target_value == 'both' and not (same_scene | bool) %}
          {% if is_hr | bool %}Dnevna: {{ living_scene_label }}{% else %}Living: {{ living_scene_label }}{% endif %}
        {% else %}
        {% endif %}

      duration_seconds: >-
        {% if kind_value == 'brightness' %}
          {{ states('input_number.pixoo_feedback_brightness_duration_seconds') | int(2) }}
        {% elif kind_value == 'scene' %}
          {{ states('input_number.pixoo_feedback_scene_duration_seconds') | int(3) }}
        {% elif kind_value == 'toggle' %}
          {{ states('input_number.pixoo_feedback_toggle_duration_seconds') | int(2) }}
        {% else %}
          {{ states('input_number.pixoo_feedback_target_duration_seconds') | int(3) }}
        {% endif %}
      resume_rotation_seconds: "{{ states('input_number.pixoo_feedback_resume_rotation_seconds') | int(5) }}"
      service_hold_seconds: "{{ (duration_seconds | int(2)) + (resume_rotation_seconds | int(5)) }}"

      single_bar_width: "{{ [1, ((single_pct | int(0)) * 46 / 100) | round(0) | int] | max }}"
      both_bar_width: "{{ [1, ((both_pct | int(0)) * 46 / 100) | round(0) | int] | max }}"
      single_highlight_width: "{{ [1, (single_bar_width | int(1)) - 2] | max }}"
      both_highlight_width: "{{ [1, (both_bar_width | int(1)) - 2] | max }}"

      # Embedded modern pixel-art icons; no extra files are required on HA.
      icon_living: ""
      icon_dining: ""
      icon_both: ""
      icon_bulb_on: ""
      icon_bulb_off: ""
      icon_brightness: ""
      icon_scene: ""

      icon_ambilight_on: ""
      icon_ambilight_off: ""
      target_icon: >-
        {% if target_value == 'ambilight' %}{{ icon_ambilight_on }}
        {% elif target_value == 'dining' %}{{ icon_dining }}
        {% elif target_value == 'both' %}{{ icon_both }}
        {% else %}{{ icon_living }}{% endif %}
      bulb_icon: "{{ icon_bulb_on if state | default('off') == 'on' else icon_bulb_off }}"
      status_icon: >-
        {% if target_value == 'ambilight' %}
          {{ icon_ambilight_on if state | default('off') == 'on' else icon_ambilight_off }}
        {% else %}
          {{ bulb_icon }}
        {% endif %}

    sequence:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_enabled
        state: "on"

      # Start/restart the independent restore timer before rendering. This means
      # even if a rapid new rotary event restarts this script while show_message
      # is still running, the final event always leaves a restore timer active.
      - action: timer.start
        target:
          entity_id: timer.pixoo_feedback_restore
        data:
          duration: "{{ duration_seconds | int(2) }}"

      - choose:
          # ----------------------------------------------------
          # Selected room / Odabrana soba
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'target' }}"
            sequence:
              - action: divoom_pixoo.show_message
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(8) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 7, 13], filled: true}
                      - {type: rectangle, position: [3, 4], size: [58, 56], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 56], color: [10, 23, 36], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 2], color: [78, 186, 255], filled: true}
                      - {type: image, position: [20, 6], image_data: "{{ target_icon }}", resample_mode: nearest}
                      - type: text
                        position: [31, 33]
                        content: "{{ selected_room_label }}"
                        font: Tiny5
                        color: [126, 200, 245]
                        align: center
                      - type: text
                        position: [31, 44]
                        content: "{{ target_label }}"
                        font: Tiny5
                        color: [246, 250, 255]
                        align: center
                      - {type: rectangle, position: [12, 54], size: [40, 2], color: [28, 68, 96], filled: true}
                      - {type: rectangle, position: [20, 54], size: [24, 2], color: [85, 214, 187], filled: true}

          # ----------------------------------------------------
          # On/off status
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'toggle' }}"
            sequence:
              - action: divoom_pixoo.show_message
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(7) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 7, 13], filled: true}
                      - {type: rectangle, position: [3, 4], size: [58, 56], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 56], color: [11, 22, 29], filled: true}
                      - type: rectangle
                        position: [2, 2]
                        size: [58, 2]
                        color: "{{ [83, 235, 157] if state | default('off') == 'on' else [110, 124, 139] }}"
                        filled: true
                      - {type: image, position: [20, 5], image_data: "{{ status_icon }}", resample_mode: nearest}
                      - type: text
                        position: [31, 32]
                        content: "{{ target_context }}"
                        font: Tiny5
                        color: [184, 211, 229]
                        align: center
                      - type: text
                        position: [31, 42]
                        content: "{{ state_label }}"
                        font: Tiny5
                        color: "{{ [116, 255, 180] if state | default('off') == 'on' else [180, 190, 201] }}"
                        align: center
                      - type: text
                        position: [31, 51]
                        content: "{{ mode_label }}"
                        font: Tiny5
                        color: [255, 195, 92]
                        align: center

          # ----------------------------------------------------
          # Brightness - single room
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'brightness' and target_value in ['living', 'dining'] }}"
            sequence:
              - action: divoom_pixoo.show_message
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(7) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [4, 7, 12], filled: true}
                      - {type: rectangle, position: [3, 4], size: [58, 56], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 56], color: [22, 20, 17], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 2], color: [255, 199, 70], filled: true}
                      - {type: image, position: [4, 7], image_data: "{{ icon_brightness }}", resample_mode: nearest}
                      - type: text
                        position: [45, 7]
                        content: "{{ brightness_label }}"
                        font: Tiny5
                        color: [255, 207, 95]
                        align: center
                      - type: text
                        position: [45, 18]
                        content: "{{ single_pct }}%"
                        font: ELEVEN_PIX
                        color: [255, 249, 226]
                        align: center
                      - {type: rectangle, position: [8, 39], size: [50, 10], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [6, 37], size: [50, 10], color: [105, 77, 28], filled: true}
                      - {type: rectangle, position: [8, 39], size: [46, 6], color: [38, 33, 24], filled: true}
                      - type: rectangle
                        position: [8, 39]
                        size: ["{{ single_bar_width }}", 6]
                        color: [246, 176, 43]
                        filled: true
                      - type: rectangle
                        position: [9, 39]
                        size: ["{{ single_highlight_width }}", 1]
                        color: [255, 239, 170]
                        filled: true
                      - type: text
                        position: [31, 52]
                        content: "{{ target_context }}"
                        font: Tiny5
                        color: [176, 193, 205]
                        align: center

          # ----------------------------------------------------
          # Brightness - both rooms
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'brightness' and target_value == 'both' }}"
            sequence:
              - action: divoom_pixoo.show_message
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(7) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [4, 7, 12], filled: true}
                      - {type: rectangle, position: [3, 4], size: [58, 56], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 56], color: [22, 20, 17], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 2], color: [255, 199, 70], filled: true}
                      - {type: image, position: [4, 7], image_data: "{{ icon_both }}", resample_mode: nearest}
                      - type: text
                        position: [45, 7]
                        content: "{{ brightness_label }}"
                        font: Tiny5
                        color: [255, 207, 95]
                        align: center
                      - type: text
                        position: [45, 18]
                        content: "{{ both_pct }}%"
                        font: ELEVEN_PIX
                        color: [255, 249, 226]
                        align: center
                      - {type: rectangle, position: [8, 39], size: [50, 10], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [6, 37], size: [50, 10], color: [105, 77, 28], filled: true}
                      - {type: rectangle, position: [8, 39], size: [46, 6], color: [38, 33, 24], filled: true}
                      - type: rectangle
                        position: [8, 39]
                        size: ["{{ both_bar_width }}", 6]
                        color: [246, 176, 43]
                        filled: true
                      - type: rectangle
                        position: [9, 39]
                        size: ["{{ both_highlight_width }}", 1]
                        color: [255, 239, 170]
                        filled: true
                      - type: text
                        position: [31, 52]
                        content: "{{ target_context }}"
                        font: Tiny5
                        color: [112, 226, 180]
                        align: center

          # ----------------------------------------------------
          # Scene
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'scene' and target_value != 'ambilight' }}"
            sequence:
              - action: divoom_pixoo.show_message
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ service_hold_seconds | int(8) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [5, 5, 11], filled: true}
                      - {type: rectangle, position: [3, 4], size: [58, 56], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 56], color: [21, 14, 30], filled: true}
                      - {type: rectangle, position: [2, 2], size: [58, 2], color: [201, 128, 255], filled: true}
                      - {type: image, position: [4, 7], image_data: "{{ icon_scene }}", resample_mode: nearest}
                      - type: text
                        position: [45, 7]
                        content: "{{ scene_label }}"
                        font: Tiny5
                        color: [211, 159, 255]
                        align: center
                      - type: text
                        position: [45, 17]
                        content: "{{ target_context }}"
                        font: Tiny5
                        color: [190, 179, 205]
                        align: center
                      - type: text
                        position: [31, 36]
                        content: "{{ scene_line_1 }}"
                        font: Tiny5
                        color: [250, 245, 255]
                        align: center
                      - type: text
                        position: [31, 47]
                        content: "{{ scene_line_2 }}"
                        font: Tiny5
                        color: [184, 158, 207]
                        align: center

# ============================================================
# EVENT BRIDGE
# ============================================================
#
# Other packages can request a temporary Pixoo page by firing:
#   event: pixoo_feedback_request
# with semantic fields such as kind, target, brightness, scene, etc.
#
# The sender does not need to know the Pixoo entity, service, or enable helper.

automation:
  - id: pixoo_feedback_restore_normal_page
    alias: Pixoo feedback - Restore normal page
    mode: restart
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.pixoo_feedback_restore
    actions:
      # Re-render the integration's current configured page (the page that was
      # visible before show_message). The integration's own scheduler remains
      # active and advances after resume_rotation_seconds.
      - action: divoom_pixoo.update_page
        target:
          entity_id: *cfg_pixoo_feedback_entity

  - id: pixoo_feedback_event_bridge
    alias: Pixoo feedback - Handle feedback request
    mode: restart
    triggers:
      - trigger: event
        event_type: pixoo_feedback_request
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_enabled
        state: "on"
    actions:
      - action: script.pixoo_feedback
        data:
          kind: "{{ trigger.event.data.kind | default('target', true) }}"
          target: "{{ trigger.event.data.target | default('living', true) }}"
          state: "{{ trigger.event.data.state | default('off', true) }}"
          dining_brightness: "{{ trigger.event.data.dining_brightness | default(0, true) }}"
          living_brightness: "{{ trigger.event.data.living_brightness | default(0, true) }}"
          dining_scene: "{{ trigger.event.data.dining_scene | default('', true) }}"
          living_scene: "{{ trigger.event.data.living_scene | default('', true) }}"

# ============================================================
# FIRST-RUN DEFAULTS
# ============================================================

  - id: pixoo_feedback_restore_initialize_defaults
    alias: Pixoo feedback - Restore initialize defaults
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_restore_initialized
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.pixoo_feedback_resume_rotation_seconds
        data:
          value: 5
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pixoo_feedback_restore_initialized

  - id: pixoo_feedback_first_run_defaults
    alias: Pixoo feedback - First run defaults
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_initialized
        state: "off"
    actions:
      - repeat:
          for_each:
            - {entity: input_number.pixoo_feedback_target_duration_seconds, value: 3}
            - {entity: input_number.pixoo_feedback_toggle_duration_seconds, value: 2}
            - {entity: input_number.pixoo_feedback_brightness_duration_seconds, value: 2}
            - {entity: input_number.pixoo_feedback_scene_duration_seconds, value: 3}
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                value: "{{ repeat.item.value }}"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.pixoo_feedback_enabled
            - input_boolean.pixoo_feedback_initialized
