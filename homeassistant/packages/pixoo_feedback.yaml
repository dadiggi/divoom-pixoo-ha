# =============================================================================
# Divoom Pixoo 64 - temporary feedback / interaction bursts
# https://github.com/dadiggi/divoom-pixoo-ha
#
# This package is intentionally separate from pixoo_animated.yaml.
# The animated dashboard keeps using pre-rendered GIF pages; this package uses
# divoom_pixoo.show_message for fast, temporary 64x64 interaction screens.
#
# The show_message service interrupts the normal page rotation for the requested
# duration, then the integration resumes the configured dashboard/weather pages.
# =============================================================================

# ============================================================
# USER CONFIGURATION
# ============================================================
# Edit the Pixoo Current Page entity here if Home Assistant names it differently.

template:
  - sensor:
      - name: Pixoo Feedback Configuration
        unique_id: pixoo_feedback_configuration
        icon: mdi:message-badge-outline
        state: configured
        attributes:
          pixoo_entity: &cfg_pixoo_feedback_entity "sensor.divoom_pixoo_64_current_page"

# ============================================================
# RUNTIME HELPERS / TUNABLE PARAMETERS
# ============================================================

input_boolean:
  pixoo_feedback_initialized:
    name: Pixoo feedback - Početne vrijednosti / Defaults applied
    icon: mdi:check-decagram
  pixoo_feedback_enabled:
    name: Pixoo feedback - Omogućeno / Enabled
    icon: mdi:message-flash

input_number:
  pixoo_feedback_target_duration_seconds:
    name: Pixoo feedback - Trajanje odabira / Target duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_toggle_duration_seconds:
    name: Pixoo feedback - Trajanje ON/OFF / On/off duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_brightness_duration_seconds:
    name: Pixoo feedback - Trajanje svjetline / Brightness duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

  pixoo_feedback_scene_duration_seconds:
    name: Pixoo feedback - Trajanje scene / Scene duration
    icon: mdi:timer-outline
    min: 1
    max: 10
    step: 1
    mode: box
    unit_of_measurement: s

# ============================================================
# GENERIC FEEDBACK API
# ============================================================
#
# Call script.pixoo_feedback with:
#   kind: target | toggle | brightness | scene
#   target: living | dining | both
#
# Optional values:
#   state: on | off
#   dining_brightness / living_brightness: 0..100
#   dining_scene / living_scene: short display names
#
# The script is generic on purpose; lighting is only its first consumer.

script:
  pixoo_feedback:
    alias: Pixoo - Privremena obavijest / Temporary feedback
    icon: mdi:message-flash-outline
    mode: restart
    fields:
      kind:
        name: Vrsta / Feedback kind
        required: true
        selector:
          select:
            options:
              - target
              - toggle
              - brightness
              - scene
      target:
        name: Prostor / Target
        required: true
        selector:
          select:
            options:
              - living
              - dining
              - both
      state:
        name: Stanje / On/off state
        required: false
        selector:
          select:
            options:
              - "on"
              - "off"
      dining_brightness:
        name: Blagovaonica - svjetlina / Dining brightness
        required: false
        selector:
          number:
            min: 0
            max: 100
      living_brightness:
        name: Dnevni - svjetlina / Living brightness
        required: false
        selector:
          number:
            min: 0
            max: 100
      dining_scene:
        name: Blagovaonica - scena / Dining scene
        required: false
      living_scene:
        name: Dnevni - scena / Living scene
        required: false
    variables:
      pixoo_entity: *cfg_pixoo_feedback_entity
      kind_value: "{{ kind | default('target') | lower }}"
      target_value: "{{ target | default('living') | lower }}"

      # Bilingual labels. Tiny5/PixelifySans support Croatian diacritics.
      target_hr: >-
        {% if target_value == 'dining' %}BLAGOVAONICA
        {% elif target_value == 'both' %}OBA
        {% else %}DNEVNI{% endif %}
      target_en: >-
        {% if target_value == 'dining' %}DINING
        {% elif target_value == 'both' %}BOTH
        {% else %}LIVING{% endif %}
      target_short_hr: >-
        {% if target_value == 'dining' %}BLAG.
        {% elif target_value == 'both' %}OBA
        {% else %}DNEVNI{% endif %}
      state_hr: "{{ 'UKLJUČENO' if state | default('off') == 'on' else 'ISKLJUČENO' }}"
      state_en: "{{ 'ON' if state | default('off') == 'on' else 'OFF' }}"
      mode_hr: "{{ 'RUČNO' if state | default('off') == 'on' else 'AUTO SPREMNO' }}"
      mode_en: "{{ 'MANUAL' if state | default('off') == 'on' else 'AUTO READY' }}"

      dining_pct: >-
        {% set v = dining_brightness | default(0) | int(0) %}
        {{ [0, [100, v] | min] | max }}
      living_pct: >-
        {% set v = living_brightness | default(0) | int(0) %}
        {{ [0, [100, v] | min] | max }}
      single_pct: "{{ living_pct if target_value == 'living' else dining_pct }}"
      both_pct: "{{ (((dining_pct | int(0)) + (living_pct | int(0))) / 2) | round(0) | int }}"

      dining_scene_en: "{{ dining_scene | default('') | upper }}"
      living_scene_en: "{{ living_scene | default('') | upper }}"
      dining_scene_hr: >-
        {% set s = dining_scene | default('') | lower %}
        {% if s == 'bright' %}JARKO
        {% elif s == 'relax' %}OPUŠTENO
        {% elif s == 'dimmed' %}PRIGUŠENO
        {% elif s == 'savanna sunset' %}SAVANA ZALAZAK
        {% else %}{{ dining_scene | default('') | upper }}{% endif %}
      living_scene_hr: >-
        {% set s = living_scene | default('') | lower %}
        {% if s == 'bright' %}JARKO
        {% elif s == 'relax' %}OPUŠTENO
        {% elif s == 'dimmed' %}PRIGUŠENO
        {% elif s == 'savanna sunset' %}SAVANA ZALAZAK
        {% else %}{{ living_scene | default('') | upper }}{% endif %}
      single_scene_hr: "{{ living_scene_hr if target_value == 'living' else dining_scene_hr }}"
      single_scene_en: "{{ living_scene_en if target_value == 'living' else dining_scene_en }}"
      same_scene: "{{ dining_scene_en == living_scene_en }}"
      scene_line_1: >-
        {% if target_value != 'both' %}
          {{ single_scene_hr }}
        {% elif same_scene | bool %}
          {{ dining_scene_hr }}
        {% else %}
          B: {{ dining_scene_hr }}
        {% endif %}
      scene_line_2: >-
        {% if target_value != 'both' %}
          {{ single_scene_en }}
        {% elif same_scene | bool %}
          {{ dining_scene_en }}
        {% else %}
          D: {{ living_scene_hr }}
        {% endif %}
      scene_line_3: >-
        {% if target_value == 'both' and not (same_scene | bool) %}
          DINING / LIVING
        {% else %}
        {% endif %}

      duration_seconds: >-
        {% if kind_value == 'brightness' %}
          {{ states('input_number.pixoo_feedback_brightness_duration_seconds') | int(2) }}
        {% elif kind_value == 'scene' %}
          {{ states('input_number.pixoo_feedback_scene_duration_seconds') | int(3) }}
        {% elif kind_value == 'toggle' %}
          {{ states('input_number.pixoo_feedback_toggle_duration_seconds') | int(2) }}
        {% else %}
          {{ states('input_number.pixoo_feedback_target_duration_seconds') | int(3) }}
        {% endif %}

      # Progress widths for a 46px inner track.
      single_bar_width: "{{ [1, ((single_pct | int(0)) * 46 / 100) | round(0) | int] | max }}"
      both_bar_width: "{{ [1, ((both_pct | int(0)) * 46 / 100) | round(0) | int] | max }}"
      single_highlight_width: "{{ [1, (single_bar_width | int(1)) - 2] | max }}"
      both_highlight_width: "{{ [1, (both_bar_width | int(1)) - 2] | max }}"

    sequence:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_enabled
        state: "on"

      - choose:
          # ----------------------------------------------------
          # Odabir prostora / Target selection
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'target' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ duration_seconds | int(3) }}"
                  page_data:
                    page_type: components
                    components:
                      # Deep background + offset shadow creates a small 3D card.
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [18, 38, 58], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [9, 20, 33], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [84, 188, 255], filled: true}
                      - {type: rectangle, position: [3, 6], size: [2, 48], color: [41, 105, 165], filled: true}
                      - type: text
                        position: [31, 8]
                        content: "UPRAVLJANJE"
                        font: Tiny5
                        color: [122, 205, 255]
                        align: center
                      - type: text
                        position: [31, 14]
                        content: "CONTROL"
                        font: Tiny5
                        color: [79, 126, 163]
                        align: center
                      - type: text
                        position: [31, 25]
                        content: "{{ target_hr }}"
                        font: PixelifySans
                        color: [245, 250, 255]
                        align: center
                      - type: text
                        position: [31, 36]
                        content: "{{ target_en }}"
                        font: Tiny5
                        color: [147, 180, 207]
                        align: center
                      - type: text
                        position: [31, 47]
                        content: "ODABRANO"
                        font: Tiny5
                        color: [255, 196, 92]
                        align: center
                      - type: text
                        position: [31, 53]
                        content: "SELECTED"
                        font: Tiny5
                        color: [153, 108, 45]
                        align: center

          # ----------------------------------------------------
          # Uključi/isključi / On-off result
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'toggle' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ duration_seconds | int(2) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [25, 45, 55], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [10, 22, 30], filled: true}
                      - type: rectangle
                        position: [3, 4]
                        size: [55, 2]
                        color: "{{ [83, 235, 157] if state | default('off') == 'on' else [104, 124, 145] }}"
                        filled: true
                      - type: text
                        position: [31, 8]
                        content: "{{ target_hr }}"
                        font: Tiny5
                        color: [202, 229, 247]
                        align: center
                      - type: text
                        position: [31, 14]
                        content: "{{ target_en }}"
                        font: Tiny5
                        color: [102, 151, 185]
                        align: center
                      - type: text
                        position: [31, 25]
                        content: "{{ state_hr }}"
                        font: PixelifySans
                        color: "{{ [116, 255, 180] if state | default('off') == 'on' else [168, 181, 193] }}"
                        align: center
                      - type: text
                        position: [31, 36]
                        content: "{{ state_en }}"
                        font: Tiny5
                        color: [190, 205, 218]
                        align: center
                      - type: text
                        position: [31, 47]
                        content: "{{ mode_hr }}"
                        font: Tiny5
                        color: [255, 198, 97]
                        align: center
                      - type: text
                        position: [31, 53]
                        content: "{{ mode_en }}"
                        font: Tiny5
                        color: [173, 126, 54]
                        align: center

          # ----------------------------------------------------
          # Svjetlina / Brightness - one room
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'brightness' and target_value != 'both' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ duration_seconds | int(2) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [40, 36, 22], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [18, 20, 24], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [255, 205, 76], filled: true}
                      - type: text
                        position: [31, 7]
                        content: "{{ target_short_hr }} / {{ target_en }}"
                        font: Tiny5
                        color: [211, 225, 237]
                        align: center
                      - type: text
                        position: [31, 18]
                        content: "{{ single_pct }}"
                        font: ELEVEN_PIX
                        color: [255, 248, 220]
                        align: center
                      - type: text
                        position: [49, 24]
                        content: "%"
                        font: Tiny5
                        color: [255, 205, 76]
                        align: center
                      # 3D brightness rail: shadow, frame, well, fill, highlight.
                      - {type: rectangle, position: [8, 41], size: [50, 9], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [6, 39], size: [50, 9], color: [104, 83, 35], filled: true}
                      - {type: rectangle, position: [8, 41], size: [46, 5], color: [34, 31, 24], filled: true}
                      - type: rectangle
                        position: [8, 41]
                        size: ["{{ single_bar_width }}", 5]
                        color: [245, 177, 47]
                        filled: true
                      - type: rectangle
                        position: [9, 41]
                        size: ["{{ single_highlight_width }}", 1]
                        color: [255, 237, 166]
                        filled: true
                      - type: text
                        position: [31, 51]
                        content: "SVJETLINA"
                        font: Tiny5
                        color: [255, 205, 76]
                        align: center
                      - type: text
                        position: [31, 57]
                        content: "BRIGHTNESS"
                        font: Tiny5
                        color: [142, 105, 39]
                        align: center

          # ----------------------------------------------------
          # Svjetlina / Brightness - both synchronized rooms
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'brightness' and target_value == 'both' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ duration_seconds | int(2) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [40, 36, 22], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [18, 20, 24], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [255, 205, 76], filled: true}
                      - type: text
                        position: [31, 7]
                        content: "OBA / BOTH"
                        font: Tiny5
                        color: [211, 225, 237]
                        align: center
                      - type: text
                        position: [31, 18]
                        content: "{{ both_pct }}"
                        font: ELEVEN_PIX
                        color: [255, 248, 220]
                        align: center
                      - type: text
                        position: [49, 24]
                        content: "%"
                        font: Tiny5
                        color: [255, 205, 76]
                        align: center
                      - {type: rectangle, position: [8, 41], size: [50, 9], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [6, 39], size: [50, 9], color: [104, 83, 35], filled: true}
                      - {type: rectangle, position: [8, 41], size: [46, 5], color: [34, 31, 24], filled: true}
                      - type: rectangle
                        position: [8, 41]
                        size: ["{{ both_bar_width }}", 5]
                        color: [245, 177, 47]
                        filled: true
                      - type: rectangle
                        position: [9, 41]
                        size: ["{{ both_highlight_width }}", 1]
                        color: [255, 237, 166]
                        filled: true
                      - type: text
                        position: [31, 51]
                        content: "SINKRONIZIRANO"
                        font: Tiny5
                        color: [120, 231, 181]
                        align: center
                      - type: text
                        position: [31, 57]
                        content: "SYNCHRONIZED"
                        font: Tiny5
                        color: [56, 137, 103]
                        align: center

          # ----------------------------------------------------
          # Scena / Scene
          # ----------------------------------------------------
          - conditions:
              - condition: template
                value_template: "{{ kind_value == 'scene' }}"
            sequence:
              - action: divoom_pixoo.show_message
                continue_on_error: true
                target:
                  entity_id: "{{ pixoo_entity }}"
                data:
                  duration: "{{ duration_seconds | int(3) }}"
                  page_data:
                    page_type: components
                    components:
                      - {type: rectangle, position: [0, 0], size: [64, 64], color: [3, 6, 12], filled: true}
                      - {type: rectangle, position: [6, 7], size: [55, 52], color: [0, 0, 0], filled: true}
                      - {type: rectangle, position: [4, 5], size: [55, 52], color: [38, 25, 52], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 52], color: [18, 13, 27], filled: true}
                      - {type: rectangle, position: [3, 4], size: [55, 2], color: [201, 128, 255], filled: true}
                      - type: text
                        position: [31, 7]
                        content: "{{ target_short_hr }} / {{ target_en }}"
                        font: Tiny5
                        color: [218, 208, 232]
                        align: center
                      - type: text
                        position: [31, 15]
                        content: "SCENA / SCENE"
                        font: Tiny5
                        color: [201, 128, 255]
                        align: center
                      - type: text
                        position: [31, 28]
                        content: "{{ scene_line_1 }}"
                        font: Tiny5
                        color: [249, 245, 255]
                        align: center
                      - type: text
                        position: [31, 40]
                        content: "{{ scene_line_2 }}"
                        font: Tiny5
                        color: [181, 158, 204]
                        align: center
                      - type: text
                        position: [31, 49]
                        content: "{{ scene_line_3 }}"
                        font: Tiny5
                        color: [116, 92, 139]
                        align: center

# ============================================================
# EVENT BRIDGE
# ============================================================
#
# Other packages can request a temporary Pixoo page by firing:
#   event: pixoo_feedback_request
# with semantic fields such as kind, target, brightness, scene, etc.
#
# The sender does not need to know the Pixoo entity, service, or enable helper.

automation:
  - id: pixoo_feedback_event_bridge
    alias: Pixoo feedback - Obradi zahtjev / Handle feedback request
    mode: restart
    triggers:
      - trigger: event
        event_type: pixoo_feedback_request
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_enabled
        state: "on"
    actions:
      - action: script.pixoo_feedback
        data:
          kind: "{{ trigger.event.data.kind | default('target', true) }}"
          target: "{{ trigger.event.data.target | default('living', true) }}"
          state: "{{ trigger.event.data.state | default('off', true) }}"
          dining_brightness: "{{ trigger.event.data.dining_brightness | default(0, true) }}"
          living_brightness: "{{ trigger.event.data.living_brightness | default(0, true) }}"
          dining_scene: "{{ trigger.event.data.dining_scene | default('', true) }}"
          living_scene: "{{ trigger.event.data.living_scene | default('', true) }}"

# ============================================================
# FIRST-RUN DEFAULTS
# ============================================================

  - id: pixoo_feedback_first_run_defaults
    alias: Pixoo feedback - Početne vrijednosti / First run defaults
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.pixoo_feedback_initialized
        state: "off"
    actions:
      - repeat:
          for_each:
            - {entity: input_number.pixoo_feedback_target_duration_seconds, value: 3}
            - {entity: input_number.pixoo_feedback_toggle_duration_seconds, value: 2}
            - {entity: input_number.pixoo_feedback_brightness_duration_seconds, value: 2}
            - {entity: input_number.pixoo_feedback_scene_duration_seconds, value: 3}
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                value: "{{ repeat.item.value }}"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.pixoo_feedback_enabled
            - input_boolean.pixoo_feedback_initialized
