# =============================================================================
# Divoom Pixoo 64 – animated dashboard + weather (Home Assistant package)
# https://github.com/dadiggi/divoom-pixoo-ha
#
# Requires: /config/pixoo/pixoo_render.py  and packages enabled in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# >>> Change entity IDs in the "payload" template below to match your setup. <<<
# =============================================================================

input_select:
  # WHAT the pages look like (layout + art style)
  pixoo_design:
    name: Pixoo design
    icon: mdi:palette-swatch-variant
    options:
      - classic
      - mondrian
      - van_gogh
      - hokusai
      - klimt
      - digital_rain
      - block_3d
      - hud
      - comic
      - mech
      - platformer
      - purist                  # clean and clear: every value labelled, maximum legibility
      - kid                     # drawn by a five-year-old with crayons
      - rotate                  # a different design every rotation interval
      - rotate (no classic)
  # HOW it is coloured - works with every design
  pixoo_theme:
    name: Pixoo theme
    icon: mdi:palette
    options:
      - original                # the design's own intended colours
      - seasonal (auto)         # original; Halloween Oct 24-31; Christmas Dec 1 - Jan 6
      - neon
      - steel
      - synthwave
      - crimson_desert
      - christmas
      - halloween
      - retro_platformer
      - rotate                  # a different theme every rotation interval
  # HOW OFTEN design/theme change when set to "rotate"
  pixoo_rotation:
    name: Pixoo rotation interval
    icon: mdi:rotate-3d-variant
    options:
      - daily
      - every 6 hours
      - hourly
  # Panel calibration (not a style): keeps colours vivid at low brightness
  pixoo_colors:
    name: Pixoo colour boost
    icon: mdi:brightness-6
    options:
      - vivid (recommended)
      - extra vivid
      - soft
      - "off"
  # Background for classic, hud, digital_rain, block_3d, mech, purist and kid
  # (art designs - mondrian, van_gogh, hokusai, klimt, comic, platformer - keep their own scenery)
  pixoo_background:
    name: Pixoo background
    icon: mdi:texture-box
    options:
      - design default
      - black
      - midnight
      - charcoal
      - forest
      - burgundy
      - ocean
      - white paper
      - kraft paper
      - notebook
      - graph paper
      - blueprint
      - chalkboard
      - wood
      - brick
      - carbon
      - denim
      - linen
      - terrazzo
      - starfield
      - day sky
      - sunset
      - polka dots
      - stripes
  # Label language of the purist and kid designs
  pixoo_language:
    name: Pixoo label language
    icon: mdi:translate
    options:
      - english
      - hrvatski

input_number:
  # MOVING PARTS - how much moves: 0 still image ... 5 everything moves
  #   1 indicators only (running machines, rain, current weather icon)  2 + gauges, forecast icons
  #   3 + scenery (sky, waves, clouds)  4 + characters and decor  5 + hand-drawn line boil
  pixoo_motion_level:
    name: Pixoo moving parts
    icon: mdi:motion
    min: 0
    max: 5
    step: 1
    initial: 5
    mode: slider
  # MOVING PARTS - speed: 0 slow (4 s per cycle) ... 3 original (2 s) ... 5 fast (1 s)
  pixoo_motion_speed:
    name: Pixoo moving parts speed
    icon: mdi:speedometer
    min: 0
    max: 5
    step: 1
    initial: 3
    mode: slider
  # EFFECTS (glints, shimmer, glitches, sparkles, scan lines, theme snow/bats/embers):
  # 0 never, 1 rare (1 in 4 minutes), 2 occasional, 3 every loop (original), 4-5 frequent
  pixoo_effects_frequency:
    name: Pixoo effects frequency
    icon: mdi:shimmer
    min: 0
    max: 5
    step: 1
    initial: 3
    mode: slider
  # EFFECTS - speed of each effect: 0 slow sweeps ... 5 quick flashes
  pixoo_effects_speed:
    name: Pixoo effects speed
    icon: mdi:flash-outline
    min: 0
    max: 5
    step: 1
    initial: 3
    mode: slider

shell_command:
  pixoo_animated_render: "python3 /config/pixoo/pixoo_render.py {{ payload }}"

automation:
  - id: pixoo_render_animated_pages
    alias: Pixoo – render animated pages
    description: Renders /config/www/pixoo/*.gif for the Pixoo 64
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: /1
      - trigger: state
        entity_id:
          - input_select.pixoo_design
          - input_select.pixoo_theme
          - input_select.pixoo_rotation
          - input_select.pixoo_colors
          - input_select.pixoo_background
          - input_select.pixoo_language
          - input_number.pixoo_motion_level
          - input_number.pixoo_motion_speed
          - input_number.pixoo_effects_frequency
          - input_number.pixoo_effects_speed
          - sensor.netatmo_smart_thermostat_current_temperature
          - sensor.outdoor_module_temperature
          - sensor.wellbeing_electrolux_air_purifier_humidity
          - sensor.zagreb_1_croatia_air_quality_index
          - input_select.washing_machine_state_machine
          - input_select.dryer_state_machine
          - sensor.p1s_01p00c462500605_print_status
          - sensor.p1s_01p00c462500605_print_progress
          - weather.meteo
          - sun.sun
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.meteo
        data:
          type: daily
        response_variable: fc
        continue_on_error: true
      - action: weather.get_forecasts
        target:
          entity_id: weather.meteo
        data:
          type: hourly
        response_variable: fch
        continue_on_error: true
      - variables:
          payload: >-
            {% set W = 'weather.meteo' %}
            {% set wm_e = states.input_select.washing_machine_state_machine %}
            {% set td_e = states.input_select.dryer_state_machine %}
            {% set pr_e = states.sensor.p1s_01p00c462500605_print_status %}
            {% set DAYS = ['PO', 'UT', 'SR', 'ČE', 'PE', 'SU', 'NE'] %}
            {% set ns = namespace(days=[], hours=[]) %}
            {% set items = fc[W].forecast if (fc is defined and fc and W in fc) else [] %}
            {% for f in items[:5] %}
              {% set dt = as_local(as_datetime(f.datetime)) %}
              {% set ns.days = ns.days + [{
                'd': DAYS[dt.weekday()], 'wd': dt.isoweekday(),
                'date': dt.date() | string, 'c': f.get('condition'),
                'hi': f.get('temperature'), 'lo': f.get('templow')
              }] %}
            {% endfor %}
            {# hourly forecast for the REST of today -> umbrella on the dashboard #}
            {% set hitems = fch[W].forecast if (fch is defined and fch and W in fch) else [] %}
            {% for f in hitems %}
              {% set dt = as_local(as_datetime(f.datetime)) %}
              {% if dt.date() == now().date() and dt + timedelta(hours=1) > now() %}
                {% set ns.hours = ns.hours + [{
                  't': dt.strftime('%H'), 'p': f.get('precipitation_probability'),
                  'mm': f.get('precipitation'), 'c': f.get('condition')
                }] %}
              {% endif %}
            {% endfor %}
            {% set rise = state_attr('sun.sun', 'next_rising') %}
            {% set sett = state_attr('sun.sun', 'next_setting') %}
            {{ {
              'design': states('input_select.pixoo_design'),
              'theme':  states('input_select.pixoo_theme'),
              'rotation': states('input_select.pixoo_rotation'),
              'vivid':  states('input_select.pixoo_colors'),
              'background': states('input_select.pixoo_background'),
              'lang':   states('input_select.pixoo_language'),
              'motion': states('input_number.pixoo_motion_level') | float(5) | int,
              'motion_speed': states('input_number.pixoo_motion_speed') | float(3) | int,
              'fx':     states('input_number.pixoo_effects_frequency') | float(3) | int,
              'fx_speed': states('input_number.pixoo_effects_speed') | float(3) | int,
              't_in':   states('sensor.netatmo_smart_thermostat_current_temperature'),
              't_out':  states('sensor.outdoor_module_temperature'),
              'h_in':   states('sensor.wellbeing_electrolux_air_purifier_humidity'),
              'h_out':  state_attr('weather.openweathermap_current', 'humidity'),
              'aqi':    states('sensor.zagreb_1_croatia_air_quality_index'),
              'wm':     wm_e.state if wm_e else 'unknown',
              'td':     td_e.state if td_e else 'unknown',
              'pr':     pr_e.state if pr_e else 'unknown',
              'wm_age': ((now() - wm_e.last_changed).total_seconds() | int) if wm_e else none,
              'td_age': ((now() - td_e.last_changed).total_seconds() | int) if td_e else none,
              'pr_age': ((now() - pr_e.last_changed).total_seconds() | int) if pr_e else none,
              'pr_left': states('sensor.p1s_01p00c462500605_remaining_time'),
              'pr_pct': states('sensor.p1s_01p00c462500605_print_progress'),
              'time':   now().strftime('%H:%M'),
              'date':   now().day ~ '.' ~ now().month,
              'dow':    DAYS[now().weekday()],
              'today':  now().date() | string,
              'sun':    states('sun.sun'),
              'sunrise': as_local(as_datetime(rise)).strftime('%H:%M') if rise else none,
              'sunset':  as_local(as_datetime(sett)).strftime('%H:%M') if sett else none,
              'wind_speed':   state_attr(W, 'wind_speed'),
              'wind_unit':    state_attr(W, 'wind_speed_unit'),
              'wind_bearing': state_attr(W, 'wind_bearing'),
              'weather': {'condition': states(W), 'temperature': state_attr(W, 'temperature')},
              'forecast': ns.days,
              'hourly_ok': hitems | length > 0,
              'hourly': ns.hours
            } | to_json | base64_encode }}
      - action: shell_command.pixoo_animated_render
        data:
          payload: "{{ payload }}"
        response_variable: result
        continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ result is not defined or result.returncode != 0 }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: pixoo_render
              message: "Pixoo render failed: {{ result.stderr if result is defined else 'no result' }}"
